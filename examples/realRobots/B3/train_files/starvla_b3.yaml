run_id: b3_stack_blocks_qwenoft
run_root_dir: /dev/shm/haowenyan/checkpoints
seed: 42
wandb_entity: null
wandb_project: starVLA_B3
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    # Override with --framework.qwenvl.base_vlm /path/to/Qwen3-VL-4B-Instruct
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    action_dim: 16
    state_dim: 16
    action_horizon: 16

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /dataset-v2/haowenyan/project/data/MRUI-Dataset/stack_blocks_latest
    data_mix: b3_stack_blocks
    action_type: abs_ee
    # This is the key actually used by the loader's action conversion.
    action_mode: abs
    include_state: true
    state_action_dtype: float32
    per_device_batch_size: 2
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true
    image_size: [224, 224]
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    delete_pause_frame: false
    drop_incomplete_action_chunks: false
    balance_trajectory_weights: true

trainer:
  # Initial recipe; tune duration using held-out episodes / robot evaluation.
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  gradient_clipping: 1.0
  # Matches the existing DeepSpeed ZeRO-2 config. The launcher verifies this.
  gradient_accumulation_steps: 1
  logging_frequency: 10
  save_format: pt
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
